<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Supreme Sensei Glowing Rings -->
    <radialGradient id="senseiCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grandRobe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadow6)">
    <!-- Base Levitating Shadow -->
    <ellipse cx="200" cy="370" rx="60" ry="10" fill="#000000" opacity="0.1"/>

    <!-- Concentric Knowledge Mandalas / Celestial AI Halo -->
    <circle cx="200" cy="180" r="140" fill="url(#senseiCore)"/>
    <circle cx="200" cy="180" r="120" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,8,12,8"/>
    <circle cx="200" cy="180" r="100" fill="none" stroke="#818CF8" stroke-width="1.5"/>

    <!-- Orbiting Knowledge Nodes -->
    <circle cx="200" cy="40" r="6" fill="#38BDF8"/>
    <circle cx="300" cy="180" r="6" fill="#38BDF8"/>
    <circle cx="200" cy="320" r="6" fill="#38BDF8"/>
    <circle cx="100" cy="180" r="6" fill="#38BDF8"/>

    <!-- Hair Back (Ageless/Long Sensei Hair) -->
    <path d="M110 130 C100 40 150 20 200 20 C250 20 300 40 290 130 Z" fill="#0F172A"/>

    <!-- Head -->
    <path d="M150 125 C150 195 250 195 250 125 Z" fill="#FFDFC4"/>

    <!-- Hair Front (Ethereal / Flowing) -->
    <path d="M130 100 Q160 40 195 65 Q210 30 235 55 Q260 35 270 80 Q280 110 260 120 Q240 90 220 100 Q190 70 165 85 Q145 85 130 100 Z" fill="#1E293B"/>

    <!-- Sensei Crown / Circuit Headband -->
    <path d="M142 105 Q200 95 258 105 L260 118 Q200 108 140 118 Z" fill="#0F172A"/>
    <circle cx="200" cy="111" r="5" fill="#38BDF8"/>

    <!-- Face Details (Eyes Closed in Serene Meditation / Complete Insight) -->
    <path d="M162 145 Q172 153 182 145" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M218 145 Q228 153 238 145" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Gentle Eyebrows -->
    <path d="M160 132 Q172 128 184 133" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M240 132 Q228 128 216 133" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Peaceful Smile -->
    <path d="M190 168 Q200 175 210 168" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Supreme White & Cyan Robes -->
    <path d="M115 175 L285 175 L310 330 L90 330 Z" fill="url(#grandRobe)"/>

    <!-- Dark Under-robe & Belt -->
    <path d="M160 175 L200 230 L240 175 Z" fill="#0F172A"/>
    <rect x="160" y="235" width="80" height="15" fill="#0F172A" rx="3"/>
    <text x="200" y="247" fill="#38BDF8" font-family="'Courier New', monospace" font-weight="bold" font-size="11" text-anchor="middle">成長</text>

    <!-- Floating Cloak / Sleeves -->
    <path d="M115 175 C70 210 60 270 95 290 C110 270 120 230 135 200 Z" fill="#38BDF8" opacity="0.3"/>
    <path d="M285 175 C330 210 340 270 305 290 C290 270 280 230 265 200 Z" fill="#38BDF8" opacity="0.3"/>

    <!-- Hands in Open Teaching Gesture -->
    <circle cx="150" cy="225" r="8" fill="#FFDFC4"/>
    <circle cx="250" cy="225" r="8" fill="#FFDFC4"/>

    <!-- Light Particles Levitating Hand Orbs -->
    <circle cx="150" cy="225" r="14" fill="#38BDF8" opacity="0.4"/>
    <circle cx="250" cy="225" r="14" fill="#38BDF8" opacity="0.4"/>

    <!-- Hakama Skirt Bottom -->
    <path d="M130 330 L135 355 L175 355 L180 330 Z" fill="#0F172A"/>
    <path d="M270 330 L265 355 L225 355 L220 330 Z" fill="#0F172A"/>

    <!-- Traditional Getaless Floating Footwear -->
    <rect x="125" y="352" width="52" height="12" rx="4" fill="#38BDF8"/>
    <rect x="223" y="352" width="52" height="12" rx="4" fill="#38BDF8"/>
  </g>
</svg>
